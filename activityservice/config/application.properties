spring.application.name=activityservice
server.port=8081

# ===============================
# LOGGING
# ==============================
#logging config file path (log4j2.xml)
logging.config=config/log4j2.xml

#log folder generation directory
log.dir=logs


# ===============================
# MongoDB Configuration
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/fitnessactivitydb



# ===============================
# EUREKA SERVER
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



